name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_OS: linux
          BUN_INSTALL_CPU: x64

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Validate MCP Registry metadata
        run: bun run registry:validate
